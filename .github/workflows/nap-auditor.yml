name: NAP Entity Auditor Pro

on:
  push:
    branches: [main]
    paths: ["nap-entity-auditor/**", ".github/workflows/nap-auditor.yml"]
  pull_request:
    paths: ["nap-entity-auditor/**", ".github/workflows/nap-auditor.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nap, POSTGRES_PASSWORD: nap, POSTGRES_DB: nap_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nap" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: nap-entity-auditor/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nap-entity-auditor/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Pruebas (SQLite)
        run: pytest -q
      - name: Pruebas (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nap:nap@localhost:5432/nap_test
      - name: Migraciones al día
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nap-entity-auditor/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nap-entity-auditor/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
